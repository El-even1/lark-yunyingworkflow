[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bkworkflow-mcp"
version = "0.2.0"
description = "教育赛道小红书/抖音找爆款自动化工作流 MCP Server（直连飞书多维表格 lark-cli）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "starlette>=0.38.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
bkworkflow-mcp = "bkworkflow.mcp_server:main"
bkworkflow = "bkworkflow.cli:main"
bkworkflow-web = "bkworkflow.web_app:run_server"

[tool.setuptools.packages.find]
include = ["bkworkflow*"]

[tool.setuptools.package-data]
bkworkflow = ["static/*"]
